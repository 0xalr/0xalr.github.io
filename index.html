---
layout: default
slug: home
---
<section class="hero" aria-labelledby="hero-title">
  {% include orbits.html %}
  <div class="wrap hero-inner">
    <p class="pill reveal"><span class="pill-dot" aria-hidden="true"></span>Security research · Bug bounty</p>
    <h1 id="hero-title" class="hero-word reveal"><span class="sr-only">ALR — {{ site.author }}, {{ site.tagline }}</span><span aria-hidden="true">ALR</span><span class="hero-cursor" aria-hidden="true"></span></h1>
    <div class="hero-actions reveal">
      <a class="btn btn--primary" href="{{ '/writeups/' | relative_url }}">Read writeups</a>
      <a class="btn btn--ghost" href="{{ '/contact/' | relative_url }}">Get in touch</a>
    </div>
  </div>
  <a class="scroll-cue" href="#contact-cta" aria-label="Skip to contact"><span aria-hidden="true"></span></a>
</section>

<section class="section section--cta" id="contact-cta" aria-labelledby="cta-h">
  <div class="wrap">
    <div class="panel cta reveal">
      <div>
        <p class="kicker">Contact</p>
        <h2 id="cta-h" class="section-title">Have a question or an opportunity?</h2>
      </div>
      <a class="btn btn--primary" href="{{ '/contact/' | relative_url }}">Send a message</a>
    </div>
  </div>
</section>
