# Site settings — edit these to change the identity shown across the site.
title: ALR
author: Abdalkreem
tagline: Cybersecurity Researcher & Bug Hunter
description: >-
  ALR — Abdalkreem, cybersecurity researcher and bug hunter. Write-ups on web application
  security, authentication bypasses, access control (IDOR/BAC) and API security.
url: "https://0xalr.github.io"
baseurl: ""
lang: en
locale: en_US

# Profiles that appear in the footer, About page and structured data.
# Every link here is published by the author on their Medium articles or GitHub.
social:
  medium: https://medium.com/@0xalr
  github: https://github.com/Abdalkreem-alt
  x: https://x.com/00xalr
  x_handle: "00xalr"
  linkedin: https://www.linkedin.com/in/abdalkreem-dagga/
  instagram: https://www.instagram.com/0xalr
  hackerone: https://hackerone.com/x0xalr

# Profile card shown beside every page (left column on desktop, above the content on mobile).
# Its two buttons use social.hackerone and social.x above.
profile:
  name: Abdalkreem Dagga
  handle: "@alr"
  description: Security Researcher
  image: /assets/img/profile.webp   # 320x320 copy of the LinkedIn photo

# Shown on the Contact page.
contact:
  email: 3bddagg3@gmail.com

og_image: /assets/img/og-image.png

# Full writeups live in _writeups/ — one file per article, published at /writeups/<file-name>/.
collections:
  writeups:
    output: true
    permalink: /writeups/:name/

defaults:
  - scope:
      path: ""
      type: writeups
    values:
      layout: writeup
      severity: Critical   # badge shown before the title on the Writeups page; override per writeup

plugins:
  - jekyll-sitemap

markdown: kramdown
permalink: pretty

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools/
  - vendor/
