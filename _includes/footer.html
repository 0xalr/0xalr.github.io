<footer class="site-footer">
  <div class="wrap footer-inner">
    <a class="footer-brand" href="{{ '/' | relative_url }}" aria-label="ALR — home">
      {% include logo.html id="ftr" px=28 %}
      <span><strong>ALR</strong> · {{ site.author }} — {{ site.tagline }}</span>
    </a>
    {% include social-links.html class="footer-links" %}
    <p class="footer-meta">© {{ site.time | date: "%Y" }} {{ site.author }}</p>
  </div>
</footer>
