{%- comment -%}
  Profile card. Content comes from `profile` and `social` in _config.yml.
{%- endcomment -%}
{%- assign pr = site.profile -%}
<section class="profile" aria-labelledby="profile-name">
  <div class="profile-image-container">
  <div class="profile-photo">
    <img src="{{ pr.image | relative_url }}" width="320" height="425" alt="Photo of {{ pr.name }}" decoding="async" fetchpriority="high">
    <span class="profile-status" title="Online"><span class="sr-only">Online</span></span>
  </div>
  </div>
  <div class="profile-id">
    <h2 class="profile-name" id="profile-name">{{ pr.name }}</h2>
    <p class="profile-handle">{{ pr.handle }}</p>
    <p class="profile-desc">{{ pr.description }}</p>
  </div>
  <div class="profile-links">
    <a class="profile-btn" href="{{ site.social.hackerone }}" target="_blank" rel="me noopener">
      <svg class="profile-btn-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6.2 2.6h3.3v7.2c.9-.8 2-1.2 3.3-1.2 2.7 0 4.6 1.9 4.6 5v7.8h-3.3v-7.3c0-1.6-.8-2.5-2.3-2.5s-2.3 1-2.3 2.7v7.1H6.2Z" fill="currentColor"/><path d="M17.4 2.6h1.9v4.1h-1.9z" fill="currentColor" opacity=".55"/></svg>
      <span>HackerOne</span>
      <span class="profile-btn-arrow" aria-hidden="true">↗</span>
      <span class="sr-only"> profile (opens in a new tab)</span>
    </a>
    <a class="profile-btn" href="{{ site.social.x }}" target="_blank" rel="me noopener">
      <svg class="profile-btn-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M18.9 1.2h3.7l-8 9.1 9.4 12.5h-7.4l-5.8-7.6-6.6 7.6H.5l8.6-9.8L0 1.2h7.6l5.2 6.9Zm-1.3 19.5h2L6.5 3.2H4.3Z" fill="currentColor"/></svg>
      <span>X <span class="profile-btn-sub">(Twitter)</span></span>
      <span class="profile-btn-arrow" aria-hidden="true">↗</span>
      <span class="sr-only"> profile (opens in a new tab)</span>
    </a>
  </div>
</section>
